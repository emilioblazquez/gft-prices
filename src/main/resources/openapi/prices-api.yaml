openapi: "3.0.3"

info:
  title: Price Service API
  description: REST API for retrieving the applicable price of a product.
  version: "1.0.0"

components:
  schemas:
    PriceResponse:
      type: object
      description: Represents the applicable price returned by the service.
      properties:
        productId:
          type: integer
          format: int64
          example: 35455
        brandId:
          type: integer
          format: int64
          example: 1
        priceList:
          type: integer
          format: int64
          example: 2
        startDate:
          type: string
          format: date-time
          example: "2020-06-14T15:00:00"
        endDate:
          type: string
          format: date-time
          example: "2020-06-14T18:30:00"
        price:
          type: number
          format: double
          example: 25.45
        currency:
          type: string
          example: EUR
      required:
        - productId
        - brandId
        - priceList
        - startDate
        - endDate
        - price
        - currency

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

paths:
  /prices:
    get:
      tags:
        - Prices
      summary: Retrieve the applicable price
      description: Retrieves the applicable price based on the application date, product identifier and brand identifier.
      operationId: getApplicablePrice

      parameters:
        - name: applicationDate
          in: query
          required: true
          description: Date and time when the price should be applied
          schema:
            type: string
            format: date-time
          example: "2020-06-14T16:00:00"

        - name: productId
          in: query
          required: true
          description: Product identifier to retrieve the applicable price.
          schema:
            type: integer
            format: int64
          example: 35455

        - name: brandId
          in: query
          required: true
          description: Brand identifier
          schema:
            type: integer
            format: int64
          example: 1

      responses:
        '200':
          description: Applicable price retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'

        '400':
          description: Invalid request parameters or malformed request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

        '404':
          description: No applicable price found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'