spring:
  application:
    name: prices
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: false

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:h2:mem:prices
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console